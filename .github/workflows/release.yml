name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Unit Tests
        run: ./gradlew test
      - name: Build Plugin Package
        run: ./gradlew assembleRepo
      - name: Sign & Generate Repository Index
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
            ./gradlew :tools:index -PpluginSigningKey="$RUNNER_TEMP/signing.key"
          else
            ./gradlew :tools:genKey -PpluginSigningKey="$RUNNER_TEMP/signing.key"
            ./gradlew :tools:index -PpluginSigningKey="$RUNNER_TEMP/signing.key"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/repo/*.ppp
            build/repo/index.json
          draft: false
          prerelease: false
          generate_release_notes: true
