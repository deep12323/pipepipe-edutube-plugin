name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Unit Tests
        run: ./gradlew test
      - name: Build and index with a throwaway key
        run: |
          ./gradlew :tools:genKey -PpluginSigningKey="$RUNNER_TEMP/ci.key"
          ./gradlew :tools:index -PpluginSigningKey="$RUNNER_TEMP/ci.key"
