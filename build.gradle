// Builds this plugin into a PipePipe plugin package (.ppp):
// a zip that is both a jar (for JVM hosts) and contains classes.dex (for Android hosts),
// plus plugin.json at the root.
//
//   ./gradlew :tools:genKey    -> signing.key (once, keep it secret and backed up)
//   ./gradlew assembleRepo     -> build/repo/*.ppp
//   ./gradlew :tools:index     -> build/repo/index.json (signed)

plugins {
    id 'java-library'
}

def localProps = new Properties()
def localPropsFile = file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def sdkDir = localProps.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME')

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

subprojects {
    apply plugin: 'java-library'
}

allprojects {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (project == rootProject) {
            options.compilerArgs += ['--release', '21']
        }
    }
}

configurations.compileClasspath {
    attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
    }
}
configurations.testCompileClasspath {
    attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
    }
}
configurations.testRuntimeClasspath {
    attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
    }
}

configurations {
    desugarConfig
    r8Tool
}

dependencies {
    // Provided by the host at runtime, never bundle them
    compileOnly "com.github.InfinityLoop1308.PipePipeExtractor:extractor:$extractorVersion"
    compileOnly "com.github.TeamNewPipe:nanojson:$nanojsonVersion"
    compileOnly "org.jsoup:jsoup:$jsoupVersion"
    compileOnly "org.apache.commons:commons-lang3:$lang3Version"
    compileOnly "com.github.spotbugs:spotbugs-annotations:$spotbugsVersion"
    desugarConfig "com.android.tools:desugar_jdk_libs_configuration:$desugarJdkLibsVersion"
    r8Tool "com.android.tools:r8:9.6.0-alpha14"
    testImplementation "com.github.InfinityLoop1308.PipePipeExtractor:extractor:$extractorVersion"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def manifestFile = file('src/main/resources/plugin.json')
def manifestJson = new groovy.json.JsonSlurper().parse(manifestFile)

def extractDesugarConfig = tasks.register('extractDesugarConfig', Copy) {
    from({ zipTree(configurations.desugarConfig.singleFile) }) {
        include 'META-INF/desugar/d8/desugar.json'
        eachFile { it.path = it.name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('desugar')
}

// Dex task: supports both standard Android SDK build-tools and pure-Java R8/D8
def dex = tasks.register('dex', JavaExec) {
    dependsOn tasks.named('jar'), extractDesugarConfig
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    def outDir = layout.buildDirectory.dir('dex')
    inputs.file(jarFile)
    inputs.files(configurations.compileClasspath)
    inputs.property('minApi', pluginMinSdk)
    outputs.dir(outDir)

    classpath = configurations.r8Tool
    mainClass = 'com.android.tools.r8.D8'

    doFirst {
        def out = outDir.get().asFile
        project.delete(out)
        out.mkdirs()

        File androidJarFile = null
        if (sdkDir != null) {
            def candidate = new File(sdkDir, 'platforms/android-36/android.jar')
            if (candidate.exists()) {
                androidJarFile = candidate
            } else {
                def candidate34 = new File(sdkDir, 'platforms/android-34/android.jar')
                if (candidate34.exists()) {
                    androidJarFile = candidate34
                }
            }
        }
        if (androidJarFile == null) {
            def localJar = file('android.jar')
            if (!localJar.exists()) {
                println 'Downloading android.jar platform stubs...'
                new URL('https://github.com/Sable/android-platforms/raw/master/android-34/android.jar')
                        .withInputStream { i -> localJar.withOutputStream { it << i } }
            }
            androidJarFile = localJar
        }

        def argList = [
                '--release',
                '--min-api', pluginMinSdk,
                '--lib', androidJarFile.path,
                '--desugared-lib', layout.buildDirectory.file('desugar/desugar.json').get().asFile.path,
                '--output', out.path
        ]
        configurations.compileClasspath.files.each {
            argList += ['--classpath', it.path]
        }
        argList += jarFile.get().asFile.path
        args argList
    }
}

tasks.register('pluginPackage', Zip) {
    group = 'plugin'
    dependsOn dex
    archiveFileName = "${rootProject.name}-${manifestJson.versionCode}.ppp"
    destinationDirectory = layout.buildDirectory.dir('repo')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from({ zipTree(tasks.named('jar').get().archiveFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(layout.buildDirectory.dir('dex')) {
        include 'classes.dex'
    }
}

tasks.register('assembleRepo') {
    group = 'plugin'
    dependsOn 'pluginPackage'
}
